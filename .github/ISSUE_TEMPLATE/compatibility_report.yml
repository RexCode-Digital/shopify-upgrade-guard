name: Compatibility report
description: Report a Shopify migration risk or request an evidence-backed compatibility rule
title: "compatibility: "
body:
  - type: markdown
    attributes:
      value: "Use a minimal sanitised example. Do not include credentials, merchant/customer data, private source, or production secrets."
  - type: input
    id: tool-version
    attributes:
      label: Tool version
    validations:
      required: true
  - type: input
    id: api-version
    attributes:
      label: Affected Shopify API version or lifecycle date
      description: Use N/A when this report is not version-specific.
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Affected Shopify surface or integration
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Official Shopify documentation or release note
      description: Link the source that describes the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Source or configuration pattern to detect
      description: Show the target pattern and a minimal sanitised example.
    validations:
      required: true
  - type: textarea
    id: expected-observed
    attributes:
      label: Expected and observed behaviour
    validations:
      required: true
  - type: textarea
    id: false-positive
    attributes:
      label: Migration guidance and similar behaviour that should not trigger
      description: Describe the documented migration and any likely false-positive patterns.
    validations:
      required: false
