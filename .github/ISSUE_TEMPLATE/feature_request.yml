name: Feature request
description: Suggest an improvement to the CLI, GitHub Action, SARIF, baselines, or scanner
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The proposal can preserve offline/read-only ordinary scanning.
          required: false
        - label: The proposal can remain deterministic in CI.
          required: false
