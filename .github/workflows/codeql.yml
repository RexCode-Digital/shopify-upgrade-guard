name: CodeQL
on:
  push:
  pull_request:
  schedule: [{ cron: '23 3 * * 1' }]
permissions:
  contents: read
jobs:
  analyse:
    permissions: { security-events: write, packages: read, actions: read, contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: javascript
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
