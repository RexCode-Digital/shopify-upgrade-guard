name: CodeQL
on:
  push:
  pull_request:
  schedule: [{ cron: '23 3 * * 1' }]
permissions:
  contents: read
jobs:
  analyse:
    permissions: { security-events: write, packages: read, actions: read, contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with: { languages: javascript }
      - uses: github/codeql-action/analyze@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
