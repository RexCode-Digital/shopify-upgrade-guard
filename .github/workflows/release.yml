name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      - run: npm ci
      - run: npm test
      - run: npm run coverage
      - run: npm run lint
      - run: npm run check:dist
      - run: npm audit --omit=dev --audit-level=high
      - name: Package and smoke test
        shell: bash
        run: |
          package_dir="$(mktemp -d)"
          package_file="$(npm pack --silent --pack-destination "$package_dir")"
          smoke_dir="$(mktemp -d)"
          npm init --yes --prefix "$smoke_dir" >/dev/null
          npm install --prefix "$smoke_dir" --ignore-scripts "$package_dir/$package_file"
          "$smoke_dir/node_modules/.bin/shopify-upgrade-guard" --version
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
