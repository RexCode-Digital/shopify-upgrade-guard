name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Keep the required Node 20 branch-protection check while testing the
      # supported Node 22 and 24 runtimes. The package engine floor remains 22.
      matrix: { node: [20, 22, 24] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run coverage
      - run: npm run lint
      - run: npm run check:dist
      - run: npm pack --dry-run
      - run: npm run package:smoke
      - run: npm run action:check
      - run: npm audit --audit-level=high
  platforms:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:action
      - run: npm test
      - run: npm run lint
