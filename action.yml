name: Shopify Upgrade Guard
description: Detect documented Shopify API and platform upgrade risks in your repository
author: RexCode Digital Ltd (Efe Gökdemir)
branding:
  icon: shield
  color: purple
inputs:
  target:
    description: Shopify target version, for example 2026-10
    required: false
  fail-on:
    description: never, error, warning, or info
    required: false
    default: never
  fail-on-new:
    description: Apply fail-on only to findings introduced by the pull request
    required: false
    default: 'false'
  base-ref:
    description: Git base reference for new-only comparison; defaults to origin/PR-base on pull requests
    required: false
  path:
    description: Repository path to scan
    required: false
    default: .
runs:
  using: node24
  main: dist/index.js
outputs:
  new-finding-count:
    description: Number of findings classified as NEW
  outcome:
    description: Whether the configured failure policy passed
  finding-count:
    description: Number of active findings
  error-count:
    description: Number of active error findings
  current-versions:
    description: JSON repository version inventory
  result-json:
    description: Complete JSON scan result
